# Baut die Handy-App (Android-APK, Capacitor) in der Cloud – auf dem Entwicklungsrechner ist kein Node/Java nötig.
# Starten: Actions → „Android-App bauen“ → Run workflow. Die APK liegt danach als Artefakt am Lauf
# (bei einem Tag v* zusätzlich an einem GitHub-Release).
name: Android-App bauen

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Native Kern-Datei neben die Seite legen (für Plugins ohne Bundler)
        run: cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js

      - name: Android-Projekt anlegen
        run: npx cap add android

      - name: App-Icons und Splashscreen erzeugen
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Klingelton, Statusleisten-Icon und Berechtigungen einbauen
        run: |
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable
          cp www/sounds/oregano.wav android/app/src/main/res/raw/oregano.wav
          cp native/android/ic_stat_oregano.xml android/app/src/main/res/drawable/ic_stat_oregano.xml
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          perms = [
            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
            '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />',
            '<uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
            '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
            '<uses-permission android:name="android.permission.VIBRATE" />',
          ]
          add = ''.join('    ' + x + '\n' for x in perms if x.split('"')[1] not in s)
          s = s.replace('</manifest>', add + '</manifest>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Web-Dateien in das Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk oregano-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oregano-android-apk
          path: oregano-debug.apk

      - name: An Release anhängen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: oregano-debug.apk
